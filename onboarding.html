{% extends "mentalConsult/_Base.html" %}
{% load static %}

{% block title %}Hoàn thiện hồ sơ{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <h4 class="mb-4">Vui lòng cung cấp thông tin</h4>
    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label">{{ question_label }}</label>
        {{ field_widget }}
      </div>
      <button type="submit" name="answer" class="btn btn-primary">Gửi</button>
    </form>
    <p class="mt-3 text-muted">Còn <strong>{{ remaining|default:"" }}</strong> câu hỏi nữa.</p>
  </div>
</div>
{% endblock %}
