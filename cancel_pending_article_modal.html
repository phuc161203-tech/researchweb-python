{# templates/articleDetail/cancel_pending_article_modal.html #}
<form id="cancelArticleForm"
      method="post"
      action="{% url 'blogScience:cancel-pending-article' article.pk %}">
  {% csrf_token %}
  <div class="form-group">
    <label for="reason">
      Lý do hủy duyệt bài “{{ article.articleName }}”:
    </label>
    <textarea name="reason"
              id="reason"
              class="form-control"
              rows="4"
              placeholder="Nhập lý do tại đây..."
              required></textarea>
  </div>
  <div class="text-right">
    <button type="button" class="btn btn-secondary" data-dismiss="modal">
      Đóng
    </button>
    <button type="submit" class="btn btn-danger">
      Xác nhận hủy duyệt
    </button>
  </div>
</form>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    const form = document.getElementById('cancelArticleForm');
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      const url = form.getAttribute('action');
      const formData = new FormData(form);

      fetch(url, {
        method: 'POST',
        headers: {
          'X-Requested-With': 'XMLHttpRequest',
          'X-CSRFToken': formData.get('csrfmiddlewaretoken'),
        },
        body: formData,
      })
      .then(resp => {
        if (!resp.ok) throw new Error(`Lỗi HTTP: ${resp.status}`);
        return resp.json();
      })
      .then(data => {
        if (data.success) {
          $('#cancelArticleModal').modal('hide');
          location.reload();
        } else {
          alert(data.error || 'Đã có lỗi. Vui lòng thử lại.');
        }
      })
      .catch(err => {
        console.error("Lỗi khi hủy duyệt:", err);
        alert("Đã có lỗi khi hủy duyệt. Vui lòng thử lại.");
      });
    });
  });
</script>
