{% extends "transport/_Base.html" %}
{% load static %}

{% block content %}
<div class="container mt-4">
  <h2>Chỉnh sửa Đơn hàng #{{ order.id }}</h2>
  <form method="post" action="{% url 'logistics:admin_edit_order' order.id %}">
    {% csrf_token %}

    <!-- Người Gửi -->
    <div class="mb-3">
      <label for="sender_name" class="form-label">Tên Người Gửi</label>
      <input type="text" class="form-control" id="sender_name" name="sender_name"
             value="{{ order.sender_name }}" required>
    </div>
    <div class="mb-3">
      <label for="sender_phone" class="form-label">Số Điện Thoại Người Gửi</label>
      <input type="text" class="form-control" id="sender_phone" name="sender_phone"
             value="{{ order.sender_phone }}" required>
    </div>
    <div class="mb-3">
      <label for="sender_email" class="form-label">Email Người Gửi</label>
      <input type="email" class="form-control" id="sender_email" name="sender_email"
             value="{{ order.sender_email }}" required>
    </div>
    <div class="mb-3">
      <label for="sender_address" class="form-label">Địa Chỉ Người Gửi</label>
      <input type="text" class="form-control" id="sender_address" name="sender_address"
             value="{{ order.sender_address }}" required>
    </div>
    <div class="mb-3">
      <label for="sender_city" class="form-label">Thành Phố Người Gửi</label>
      <input type="text" class="form-control" id="sender_city" name="sender_city"
             value="{{ order.sender_city }}" required>
    </div>
    <div class="mb-3">
      <label for="sender_province" class="form-label">Tỉnh/Quận Người Gửi</label>
      <input type="text" class="form-control" id="sender_province" name="sender_province"
             value="{{ order.sender_province }}" required>
    </div>
    <div class="mb-3">
      <label for="sender_zip" class="form-label">Postal Code Người Gửi</label>
      <input type="text" class="form-control" id="sender_zip" name="sender_zip"
             value="{{ order.sender_zip }}" required>
    </div>
    <div class="mb-3">
      <label for="sender_country" class="form-label">Quốc Gia Người Gửi</label>
      <input type="text" class="form-control" id="sender_country" name="sender_country"
             value="{{ order.sender_country }}" required>
    </div>

    <!-- Người Nhận -->
    <div class="mb-3">
      <label for="receiver_name" class="form-label">Tên Người Nhận</label>
      <input type="text" class="form-control" id="receiver_name" name="receiver_name"
             value="{{ order.receiver_name }}" required>
    </div>
    <div class="mb-3">
      <label for="receiver_phone" class="form-label">Số Điện Thoại Người Nhận</label>
      <input type="text" class="form-control" id="receiver_phone" name="receiver_phone"
             value="{{ order.receiver_phone }}" required>
    </div>
    <div class="mb-3">
      <label for="receiver_email" class="form-label">Email Người Nhận</label>
      <input type="email" class="form-control" id="receiver_email" name="receiver_email"
             value="{{ order.receiver_email }}" required>
    </div>
    <div class="mb-3">
      <label for="receiver_address" class="form-label">Địa Chỉ Người Nhận</label>
      <input type="text" class="form-control" id="receiver_address" name="receiver_address"
             value="{{ order.receiver_address }}" required>
    </div>
    <div class="mb-3">
      <label for="receiver_city" class="form-label">Thành Phố Người Nhận</label>
      <input type="text" class="form-control" id="receiver_city" name="receiver_city"
             value="{{ order.receiver_city }}" required>
    </div>
    <div class="mb-3">
      <label for="receiver_province" class="form-label">Tỉnh/Quận Người Nhận</label>
      <input type="text" class="form-control" id="receiver_province" name="receiver_province"
             value="{{ order.receiver_province }}" required>
    </div>
    <div class="mb-3">
      <label for="receiver_zip" class="form-label">Postal Code Người Nhận</label>
      <input type="text" class="form-control" id="receiver_zip" name="receiver_zip"
             value="{{ order.receiver_zip }}" required>
    </div>
    <div class="mb-3">
      <label for="receiver_country" class="form-label">Quốc Gia Người Nhận</label>
      <input type="text" class="form-control" id="receiver_country" name="receiver_country"
             value="{{ order.receiver_country }}" required>
    </div>

    <!-- Thông tin đơn hàng khác (khối thông tin không có NOT NULL constraint) -->
    <div class="mb-3">
      <label for="weight" class="form-label">Khối Lượng</label>
      <input type="number" step="0.01" class="form-control" id="weight" name="weight"
             value="{{ order.weight }}">
    </div>
    <div class="mb-3">
      <label for="length" class="form-label">Chiều Dài</label>
      <input type="number" class="form-control" id="length" name="length"
             value="{{ order.length }}">
    </div>
    <div class="mb-3">
      <label for="width" class="form-label">Chiều Rộng</label>
      <input type="number" class="form-control" id="width" name="width"
             value="{{ order.width }}">
    </div>
    <div class="mb-3">
      <label for="height" class="form-label">Chiều Cao</label>
      <input type="number" class="form-control" id="height" name="height"
             value="{{ order.height }}">
    </div>
    <div class="mb-3">
      <label for="declared_value" class="form-label">Giá Trị Khai Báo</label>
      <input type="number" step="0.01" class="form-control" id="declared_value" name="declared_value"
             value="{{ order.declared_value }}">
    </div>
    <div class="mb-3">
      <label for="category" class="form-label">Loại Hàng</label>
      <input type="text" class="form-control" id="category" name="category"
             value="{{ order.category }}">
    </div>
    <div class="mb-3">
      <label for="quantity" class="form-label">Số Lượng</label>
      <input type="number" class="form-control" id="quantity" name="quantity"
             value="{{ order.quantity }}">
    </div>

    <div class="mb-3">
      <label for="service_type" class="form-label">Loại Dịch Vụ</label>
      <select class="form-select" id="service_type" name="service_type">
        <option value="standard" {% if order.service_type == 'standard' %}selected{% endif %}>Standard</option>
        <option value="express" {% if order.service_type == 'express' %}selected{% endif %}>Express</option>
      </select>
    </div>

    <div class="mb-3">
      <label for="pickup_date" class="form-label">Ngày Gửi</label>
      <input type="date" class="form-control" id="pickup_date" name="pickup_date"
             value="{{ order.pickup_date|date:'Y-m-d' }}">
    </div>
    <div class="mb-3">
      <label for="delivery_date" class="form-label">Ngày Nhận</label>
      <input type="date" class="form-control" id="delivery_date" name="delivery_date"
             value="{{ order.delivery_date|date:'Y-m-d' }}">
    </div>

    <div class="mb-3">
      <label for="payment_method" class="form-label">Phương Thức Thanh Toán</label>
      <select class="form-select" id="payment_method" name="payment_method">
        <option value="cod" {% if order.payment_method == 'cod' %}selected{% endif %}>COD</option>
        <option value="online" {% if order.payment_method == 'online' %}selected{% endif %}>Online</option>
      </select>
    </div>
    <div class="mb-3">
      <label for="shipping_cost" class="form-label">Phí Vận Chuyển</label>
      <input type="number" step="0.01" class="form-control" id="shipping_cost" name="shipping_cost"
             value="{{ order.shipping_cost }}">
    </div>
    <div class="mb-3">
      <label for="insurance" class="form-label">Bảo Hiểm</label>
      <input type="text" class="form-control" id="insurance" name="insurance"
             value="{{ order.insurance }}">
    </div>

    <div class="mb-3">
      <label for="order_channel" class="form-label">Kênh Đặt Hàng</label>
      <input type="text" class="form-control" id="order_channel" name="order_channel"
             value="{{ order.order_channel }}">
    </div>
    <div class="mb-3">
      <label for="customer_type" class="form-label">Loại Khách Hàng</label>
      <input type="text" class="form-control" id="customer_type" name="customer_type"
             value="{{ order.customer_type }}">
    </div>

    <div class="mb-3">
      <label for="status" class="form-label">Trạng Thái</label>
      <select class="form-select" id="status" name="status" required>
        <option value="pending" {% if order.status == 'pending' %}selected{% endif %}>Pending</option>
        <option value="in_transit" {% if order.status == 'in_transit' %}selected{% endif %}>In Transit</option>
        <option value="delivered" {% if order.status == 'delivered' %}selected{% endif %}>Delivered</option>
        <option value="cancelled" {% if order.status == 'cancelled' %}selected{% endif %}>Cancelled</option>
        <option value="returned" {% if order.status == 'returned' %}selected{% endif %}>Returned</option>
      </select>
    </div>

    <!-- Nếu muốn cho admin có thể chỉnh luôn vehicle_code: -->
    <div class="mb-3">
      <label for="vehicle_code" class="form-label">Mã Xe Giao Hàng</label>
      <input type="text" class="form-control" id="vehicle_code" name="vehicle_code"
             value="{{ order.vehicle_code }}">
    </div>

    <button type="submit" class="btn btn-primary">Lưu lại</button>
    <a href="{% url 'logistics:admin_dashboard' %}" class="btn btn-secondary">Quay về Dashboard</a>
  </form>
</div>
{% endblock %}
