{% extends 'greenTem/_Base.html' %}

{% block main_content %}
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Tình nguyện vì ĐBSCL</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />

  <style>
    body{font-family:"Segoe UI",Tahoma,Geneva,Verdana,sans-serif;background:#fafbfc}
    .navbar-brand{font-weight:700}
    .counter{border-radius:10px;background:#fff;box-shadow:0 4px 8px rgba(0,0,0,.05)}
    .place-card:hover{box-shadow:0 4px 10px rgba(0,0,0,.1);transform:translateY(-2px)}
    footer{background:#212529;color:#fff}
  </style>
</head>
<body>
  

  <!-- Hero -->
  <header class="py-5 bg-light border-bottom">
    <div class="container text-center">
      <h1 class="fw-bold">Gia nhập đội ngũ tình nguyện ĐBSCL</h1>
      <p class="lead">Cùng chúng tôi hỗ trợ cộng đồng vượt qua thiên tai.</p>
      <button class="btn btn-primary btn-lg" data-bs-toggle="modal" data-bs-target="#applyModal">
        <i class="fa fa-user-plus"></i> Ứng tuyển tình nguyện
      </button>
    </div>
  </header>

  <!-- Counters -->
  <section class="py-5">
    <div class="container">
      <div class="row text-center gy-4" id="counter-wrap">
        <!-- JS sẽ dựng 3 ô counter -->
      </div>
    </div>
  </section>

  <!-- Places supported -->
  <section class="py-5 bg-light">
    <div class="container">
      <h2 class="text-center mb-4">Các địa điểm đã hỗ trợ</h2>
      <div class="row g-4" id="place-list"></div>
    </div>
  </section>

  <!-- Modal apply -->
  <div class="modal fade" id="applyModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <form id="apply-form" class="modal-content needs-validation" novalidate>
        <div class="modal-header">
          <h5 class="modal-title">Đăng ký tình nguyện viên</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Họ tên</label>
              <input class="form-control" name="name" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Email</label>
              <input type="email" class="form-control" name="email" required>
            </div>
            <div class="col-md-4">
              <label class="form-label">Điện thoại</label>
              <input class="form-control" name="phone" required>
            </div>
            <div class="col-md-4">
              <label class="form-label">Độ tuổi</label>
              <input type="number" class="form-control" name="age" min="16" required>
            </div>
            <div class="col-md-4">
              <label class="form-label">Thời gian cam kết</label>
              <select class="form-select" name="period" required>
                <option value="">-- Chọn --</option>
                <option>1 tuần</option>
                <option>1 tháng</option>
                <option>3 tháng</option>
                <option>6 tháng</option>
              </select>
            </div>
            <div class="col-12">
              <label class="form-label">Tình trạng sức khỏe</label>
              <textarea class="form-control" rows="2" name="health" required></textarea>
            </div>
            <div class="col-12">
              <label class="form-label">Kỹ năng / Kinh nghiệm liên quan</label>
              <textarea class="form-control" rows="2" name="skills"></textarea>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">Huỷ</button>
          <button class="btn btn-primary" type="submit">Gửi đăng ký</button>
        </div>
      </form>
    </div>
  </div>

  <footer class="py-4">
    <div class="container text-center small">
      &copy; 2025 DBSCL Volunteer – Hành động hôm nay, thay đổi ngày mai.
    </div>
  </footer>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Fake stats
    const STATS = {volunteers:1245,schools:38,villages:102};
    const PLACES = [
      {name:'Trường Tiểu học An Bình',img:'https://source.unsplash.com/600x400/?school'},
      {name:'Ấp Tân Lập – Bến Tre',img:'https://source.unsplash.com/600x400/?village'},
      {name:'Trung tâm y tế Phú Tân',img:'https://source.unsplash.com/600x400/?clinic'},
      {name:'Trường THCS Thạnh Phú',img:'https://source.unsplash.com/600x400/?classroom'},
      {name:'Xã Hưng Điền – Long An',img:'https://source.unsplash.com/600x400/?rural'},
    ];

    // Render counters
    document.getElementById('counter-wrap').innerHTML = `
      <div class="col-md-4"><div class="counter p-4"><h2 class="fw-bold" id="c0">0</h2><p>Tình nguyện viên</p></div></div>
      <div class="col-md-4"><div class="counter p-4"><h2 class="fw-bold" id="c1">0</h2><p>Trường học / Nhà</p></div></div>
      <div class="col-md-4"><div class="counter p-4"><h2 class="fw-bold" id="c2">0</h2><p>Làng, ấp đã hỗ trợ</p></div></div>
    `;
    ['volunteers','schools','villages'].forEach((k,i)=>animateCounter(`c${i}`,STATS[k]));

    function animateCounter(id,end){
      let cur=0,step=Math.ceil(end/50);
      const el=document.getElementById(id);
      const timer=setInterval(()=>{cur+=step;el.textContent=cur; if(cur>=end){el.textContent=end;clearInterval(timer);}},40);
    }

    // Render places
    document.getElementById('place-list').innerHTML = PLACES.map(p=>`
      <div class="col-md-4">
        <div class="card place-card h-100 border-0">
          <img src="${p.img}" class="card-img-top" alt="${p.name}">
          <div class="card-body">
            <h5 class="card-title">${p.name}</h5>
          </div>
        </div>
      </div>
    `).join('');

    // Validate apply form
    const applyModal=new bootstrap.Modal('#applyModal');
    document.getElementById('apply-form').addEventListener('submit',e=>{
      e.preventDefault();
      if(!e.target.checkValidity()){e.target.classList.add('was-validated');return;}
      const data=Object.fromEntries(new FormData(e.target).entries());
      console.log('Volunteer data',data); // → gửi về server
      alert(`Cám ơn ${data.name}! Chúng tôi sẽ liên lạc qua ${data.email}.`);
      applyModal.hide();
    });

    fetch('/green/volunteer/', {
  method:'POST',
  headers:{'Content-Type':'application/json','X-CSRFToken':csrftoken},
  body: JSON.stringify(Object.fromEntries(new FormData(e.target).entries()))
})
.then(r=>r.json())
.then(res=>{ if(res.ok){ alert('Đăng ký thành công!'); applyModal.hide(); }});
  </script>
</body>
{% endblock %}
